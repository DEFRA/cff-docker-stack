services:

  flood-app:
    build:
      context: ../flood-app
      target: development
    image: flood-app 
    depends_on:
      - flood-service
    restart: on-failure
    environment:
      NODE_ENV: dev
      ENV: local
      PORT: 3001
      HOST: 0.0.0.0
      FLOOD_APP_SERVICE_URL: "http://flood-service:3003"
    env_file:
      - ../flood-app/.env
    networks:
      cff-internal:
    volumes:
      - /home/node/app/node_modules # Avoid overwriting node_modules
      - /home/node/app/coverage # Exclude coverage reports from the host
    ports:
      - "3009:3001"
    command: sh -c "npm run start:local"

  flood-service:
    build:
      context: ../flood-service
      target: development
    image: flood-service
    restart: on-failure
    environment:
      NODE_ENV: dev
      ENV: local
      PORT: 3003
      HOST: 0.0.0.0
      FLOOD_SERVICE_CONNECTION_STRING: "postgres://u_flood:secret@flood-db:5432/flooddev"
    env_file:
      - ../flood-service/.env
    networks:
      cff-internal:
    volumes:
      - /home/node/app/node_modules # Avoid overwriting node_modules
      - /home/node/app/coverage # Exclude coverage reports from the host
    ports:
      - "3003:3003"
    command: sh -c "npm run start:local"

  flood-db:
    build:
      context: ../flood-db/database/flooddev/u_flood/setup
      dockerfile: docker/Dockerfile
    image: flood-db
    shm_size: 1g
    environment:
      PGDATA: /pgdata
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/pgdata
      - wiyby:/wiyby
    networks:
      cff-internal:
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c max_wal_size=8GB -c shared_preload_libraries=pg_cron -c cron.database_name=flooddev 

volumes: 
  pgdata:
    name: flood-db-pgdata
    external: true
  wiyby:
    name: flood-db-wiyby
    external: true

networks:
  cff-internal:
