version: "3.6"

services:
  flood-app:
    build:
      context: ../flood-app
    image: flood-app 
    depends_on:
      - flood-service
    restart: on-failure
    environment:
      NODE_ENV: dev
      ENV: local
      PORT: 3001
      HOST: 0.0.0.0
      FLOOD_APP_SERVICE_URL: "http://flood-service:3003"
      FLOOD_APP_GEOSERVER_URL: "http://flood-gis:8080"
    env_file:
      - ../flood-app/.env
    networks:
      cff-internal:
    volumes:
      - ../flood-app:/usr/src/app
      # - /usr/src/app/node_modules # Avoid overwriting node_modules
    ports:
      - "3009:3001"
    command: sh -c "npm run start:local"

  flood-service:
    build:
      context: ../flood-service
    image: flood-service
    restart: on-failure
    environment:
      NODE_ENV: dev
      ENV: local
      PORT: 3003
      HOST: 0.0.0.0
      FLOOD_SERVICE_CONNECTION_STRING: "postgres://u_flood:secret@flood-db:5432/flooddev"
    env_file:
      - ../flood-service/.env
    networks:
      cff-internal:
    volumes:
      - ../flood-service:/usr/src/app
      - /usr/src/app/node_modules # Avoid overwriting node_modules
    ports:
      - "3003:3003"
    command: sh -c "npm run start:local"

  flood-service-tests:
    build:
      context: ../flood-service-tests-v2
    image: flood-service-tests
    restart: on-failure
    environment:
      NODE_ENV: dev
      ENV: local
      HOST: 0.0.0.0
      LFW_DATA_DB_CONNECTION: "postgres://u_flood:secret@flood-db:5432/flooddev"
      FLOOD_APP_SITE_URL: "http://flood-app:3001"
    env_file:
      - ../flood-service-tests-v2/.env
    networks:
      cff-internal:
    volumes:
      - ../flood-service-tests-v2:/usr/src/app
      - /usr/src/app/node_modules # Avoid overwriting node_modules
    command: sh -c "npm test"

  flood-db:
    build:
      context: ../flood-db/database/flooddev/u_flood/setup
      dockerfile: docker/Dockerfile
    image: flood-db
    shm_size: 1g
    environment:
      PGDATA: /pgdata
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/pgdata
      - wiyby:/wiyby
    networks:
      cff-internal:
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c max_wal_size=2048 # set max_wal_size to prevent warnings when restoring db

  flood-gis:
    image: docker.osgeo.org/geoserver:2.24.1
    ports:
      - "8080:8080"
    networks:
      cff-internal:
    environment:
      - INSTALL_EXTENSIONS=true
      - STABLE_EXTENSIONS=wps,csw
      - EXTRA_JAVA_OPTS=-Xms1G -Xmx2G
      - SKIP_DEMO_DATA=true
    volumes:
      - ../flood-gis/geoserver/data/:/opt/geoserver_data/
    healthcheck:
      test: curl --fail "http://flood-gis:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png" || exit 1
      interval: 1m
      retries: 3
      timeout: 20s

volumes: 
  pgdata:
    name: flood-db-pgdata
    external: true
  wiyby:
    name: flood-db-wiyby
    external: true

networks:
  cff-internal:
