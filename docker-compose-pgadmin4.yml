services:
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8080:80"  # Map port 8080 on host to port 80 inside container
    environment:
      - PGADMIN_DEFAULT_EMAIL=ubuntu@localhost.localdomain
      - PGADMIN_DEFAULT_PASSWORD=secret
    networks:
      - cff-internal
    volumes:
      - pgadmin:/var/lib/pgadmin
volumes:
  pgadmin:
    name: pgadmin
